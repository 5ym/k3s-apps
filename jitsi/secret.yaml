# jitsi の各コンポーネント間の XMPP 認証に使うパスワード。
# `openssl rand -hex 16` などで生成し、bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: jitsi-secrets
  namespace: jitsi
type: Opaque
stringData:
  JICOFO_AUTH_PASSWORD: "CHANGE_ME"
  JVB_AUTH_PASSWORD: "CHANGE_ME"
  JIGASI_XMPP_PASSWORD: "CHANGE_ME"
  JIBRI_RECORDER_PASSWORD: "CHANGE_ME"
  JIBRI_XMPP_PASSWORD: "CHANGE_ME"
