apiVersion: v1
kind: Service
metadata:
  name: prosody
  namespace: jitsi
spec:
  selector:
    app: prosody
  ports:
    - name: c2s
      port: 5222
      targetPort: 5222
    - name: bosh
      port: 5280
      targetPort: 5280
    - name: xmpp-comp
      port: 5347
      targetPort: 5347
---
apiVersion: v1
kind: Service
metadata:
  name: jw
  namespace: jitsi
spec:
  selector:
    app: jw
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# JVB のメディア（UDP 10000 / TCP 4443）は Traefik を通らないので、
# k3s の ServiceLB で直接公開する。
apiVersion: v1
kind: Service
metadata:
  name: jvb
  namespace: jitsi
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: jvb
  ports:
    - name: media
      port: 10000
      targetPort: 10000
      protocol: UDP
