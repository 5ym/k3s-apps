apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jw
  namespace: jitsi
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # TODO: example.test はプレースホルダ。実ホスト名に変更すること。
    # 変更したら configmap.yaml の PUBLIC_URL も合わせること。
    - match: Host(`example.test`)
      kind: Rule
      services:
        - name: jw
          port: 80
