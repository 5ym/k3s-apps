apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guacamole-postgres
  namespace: guacamole
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
