# chart の openproject.secretKeyBase / openproject.admin_user から引く。
#
# secret-key-base はセッションの署名鍵。漏れると成りすませるので、
# 必ず自分で生成した値を使うこと:
#      openssl rand -hex 64
# admin-password は初回ログイン用の管理者パスワード:
#      openssl rand -base64 32
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: openproject
  namespace: openproject
type: Opaque
stringData:
  secret-key-base: "CHANGE_ME"
  admin-password: "CHANGE_ME"
