# !! 旧 compose.openproject.yml には SECRET_KEY_BASE が平文で public リポジトリに
#    コミットされていた。ここには持ち込んでいないので、必ず新しい値を生成し直すこと:
#      openssl rand -hex 64
#    実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: openproject
  namespace: openproject
type: Opaque
stringData:
  secret-key-base: "CHANGE_ME"
