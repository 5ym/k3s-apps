apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openproject
  namespace: openproject
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # 変更したら application.yaml の openproject.host も合わせること。
    - match: Host(`ot.doany.io`)
      kind: Rule
      services:
        # chart が作る Service。fullnameOverride: openproject で名前を固定し、
        # port は chart 既定の 8080。
        - name: openproject
          port: 8080
