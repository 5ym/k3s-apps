# Nextcloud の初期管理者アカウント。chart の nextcloud.existingSecret から引く。
# パスワードは `openssl rand -base64 32` などで生成すること。
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud
  namespace: nextcloud
type: Opaque
stringData:
  nextcloud-username: admin
  nextcloud-password: "CHANGE_ME"
