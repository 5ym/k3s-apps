apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # 変更したら application.yaml の nextcloud.host / trustedDomains も合わせること。
    - match: Host(`nd.doany.io`)
      kind: Rule
      services:
        # chart が作る Service。fullnameOverride: nextcloud で名前を固定し、
        # port は chart 既定の 8080（コンテナ側は 80）。
        - name: nextcloud
          port: 8080
