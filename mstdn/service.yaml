# mstdn-web / mstdn-streaming の Service は chart 側（application.yaml）が出す。
# ここに残しているのは PostgreSQL と Redis だけ。
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: mstdn
spec:
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mstdn
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
