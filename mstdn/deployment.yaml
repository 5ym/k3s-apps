# Mastodon 本体（web / streaming / sidekiq）は chart 側（application.yaml）が出す。
# ここに残しているのは chart に同梱されていない PostgreSQL と Redis だけ。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: mstdn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:18-alpine
          env:
            - name: TZ
              value: Asia/Tokyo
            # postgres:18 は既定の PGDATA が変わっているので明示する
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # ユーザ名とパスワードは chart 側と同じ Secret から引く
            # （application.yaml の postgresql.existingSecret）
            - name: POSTGRES_DB
              value: mastodon
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mstdn-db-auth
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mstdn-db-auth
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mstdn-db
---
# chart は Redis のパスワードを必須にしているので requirepass で立てる。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mstdn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10-alpine
          command: ["sh", "-c", 'exec redis-server --requirepass "$REDIS_PASSWORD"']
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mstdn-redis-auth
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping']
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mstdn-redis
