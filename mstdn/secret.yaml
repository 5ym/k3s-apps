# Mastodon の鍵。chart の mastodon.secrets.existingSecret から引く。
# 鍵の名前（key）は chart の既定値 mastodon.secrets.existingSecretKeys に合わせてある。
#
#   secret-key-base
#     docker run --rm ghcr.io/mastodon/mastodon bundle exec rake secret
#   vapid-private-key / vapid-public-key
#     docker run --rm ghcr.io/mastodon/mastodon bundle exec rake mastodon:webpush:generate_vapid_key
#   are-primary-key / are-deterministic-key / are-derivation-salt
#     Active Record Encryption の鍵（Mastodon 4.3 以降で必須）。
#     docker run --rm ghcr.io/mastodon/mastodon bin/rails db:encryption:init
#
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: mstdn-secrets
  namespace: mstdn
type: Opaque
stringData:
  secret-key-base: "CHANGE_ME"
  vapid-private-key: "CHANGE_ME"
  vapid-public-key: "CHANGE_ME"
  are-primary-key: "CHANGE_ME"
  are-deterministic-key: "CHANGE_ME"
  are-derivation-salt: "CHANGE_ME"
---
# PostgreSQL の資格情報。deployment.yaml の postgres と chart 側の
# postgresql.existingSecret の両方がこれを引くので、必ず1か所で持つこと。
#      openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: mstdn-db-auth
  namespace: mstdn
type: Opaque
stringData:
  username: mastodon
  password: "CHANGE_ME"
---
# Redis のパスワード。deployment.yaml の redis が requirepass に使い、
# chart 側は redis.existingSecret として引く。
#      openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: mstdn-redis-auth
  namespace: mstdn
type: Opaque
stringData:
  password: "CHANGE_ME"
---
# メール送信の資格情報。chart の mastodon.smtp.existingSecret から引く。
# 秘密でない項目（server / port / fromAddress など）は
# application.yaml の mastodon.smtp に足すこと。
apiVersion: v1
kind: Secret
metadata:
  name: mstdn-smtp
  namespace: mstdn
type: Opaque
stringData:
  username: ""
  password: ""
