# 旧 mstdn/.env.production 相当。env_file の代わりに envFrom で全コンテナに渡す。
# SECRET_KEY_BASE / OTP_SECRET / VAPID_* は
#   docker run --rm tootsuite/mastodon bundle exec rake secret
#   docker run --rm tootsuite/mastodon bundle exec rake mastodon:webpush:generate_vapid_key
# で生成する。実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: mstdn-env
  namespace: mstdn
type: Opaque
stringData:
  LOCAL_DOMAIN: m.doany.io
  SINGLE_USER_MODE: "false"

  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASS: "CHANGE_ME"

  REDIS_HOST: redis
  REDIS_PORT: "6379"

  SECRET_KEY_BASE: "CHANGE_ME"
  OTP_SECRET: "CHANGE_ME"
  VAPID_PRIVATE_KEY: "CHANGE_ME"
  VAPID_PUBLIC_KEY: "CHANGE_ME"

  SMTP_SERVER: ""
  SMTP_PORT: "587"
  SMTP_LOGIN: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_ADDRESS: ""
