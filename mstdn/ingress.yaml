apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mstdn
  namespace: mstdn
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # IngressRoute は match の長さで優先度が決まらないので、
    # streaming 側を先に評価させるため priority を明示している。
    #
    # 変更したら application.yaml の mastodon.localDomain も合わせること。
    # Service 名と port は chart が出すもの（fullnameOverride: mstdn）。
    - match: Host(`t.doany.io`) && PathPrefix(`/api/v1/streaming`)
      kind: Rule
      priority: 20
      services:
        - name: mstdn-streaming
          port: 4000
    - match: Host(`t.doany.io`)
      kind: Rule
      priority: 10
      services:
        - name: mstdn-web
          port: 3000
