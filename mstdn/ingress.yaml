apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mstdn
  namespace: mstdn
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # !! 注意: m.doany.io は misskey とホスト名が衝突する。両方同時には適用しないこと。
    # IngressRoute は match の長さで優先度が決まらないので、
    # streaming 側を先に評価させるため priority を明示している。
    - match: Host(`m.doany.io`) && PathPrefix(`/api/v1/streaming`)
      kind: Rule
      priority: 20
      services:
        - name: mstdn-streaming
          port: 4000
    - match: Host(`m.doany.io`)
      kind: Rule
      priority: 10
      services:
        - name: mstdn
          port: 3000
