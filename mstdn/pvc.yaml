apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mstdn-db
  namespace: mstdn
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mstdn-redis
  namespace: mstdn
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 5Gi
---
# web と sidekiq が共有する。local-path は単一ノードなので
# 同一ノードに載る限り ReadWriteOnce のまま両方から mount できる。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mstdn-system
  namespace: mstdn
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 50Gi
