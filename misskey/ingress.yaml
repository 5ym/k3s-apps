apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: misskey
  namespace: misskey
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # !! 注意: m.doany.io は mstdn の IngressRoute とホスト名が衝突する。
    #    両方同時には適用しないこと。
    - match: Host(`m.doany.io`)
      kind: Rule
      services:
        - name: misskey
          port: 3000
