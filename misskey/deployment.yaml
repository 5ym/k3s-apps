apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: misskey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:18-alpine
          envFrom:
            - secretRef:
                name: misskey-db
          env:
            - name: TZ
              value: Asia/Tokyo
            # postgres:18 でイメージ既定の PGDATA が変わったため明示指定する
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: misskey-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: misskey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            periodSeconds: 5
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: misskey-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: misskey
  namespace: misskey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: misskey
  template:
    metadata:
      labels:
        app: misskey
    spec:
      containers:
        - name: misskey
          image: misskey/misskey
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: files
              mountPath: /misskey/files
            - name: config
              mountPath: /misskey/.config
              readOnly: true
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: misskey-files
        - name: config
          secret:
            secretName: misskey-config
