# misskey の default.yml と DB 用の環境変数。
# default.yml は DB パスワードを含むので ConfigMap ではなく Secret に置いている。
# misskey-db の POSTGRES_* と default.yml の db: セクションは必ず一致させること。
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: misskey-config
  namespace: misskey
type: Opaque
stringData:
  default.yml: |
    url: https://m.doany.io/
    port: 3000

    db:
      host: db
      port: 5432
      db: misskey
      user: misskey
      pass: CHANGE_ME

    redis:
      host: redis
      port: 6379

    id: 'aidx'
---
apiVersion: v1
kind: Secret
metadata:
  name: misskey-db
  namespace: misskey
type: Opaque
stringData:
  POSTGRES_DB: misskey
  POSTGRES_USER: misskey
  POSTGRES_PASSWORD: "CHANGE_ME"
