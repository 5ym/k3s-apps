# 旧 lego-compose の CLOUDFLARE_EMAIL / CLOUDFLARE_API_KEY 相当。
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
# bootstrap 側の traefik-cloudflare Secret と同じ資格情報を使い回してもよい。
apiVersion: v1
kind: Secret
metadata:
  name: lego-cloudflare
  namespace: lego
type: Opaque
stringData:
  CLOUDFLARE_EMAIL: "CHANGE_ME"
  CLOUDFLARE_API_KEY: "CHANGE_ME"
