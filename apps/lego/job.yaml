# 初回発行用。旧 init.sh の `lego ... run` 相当で、一度だけ実行する。
# 以降の更新は cronjob.yaml（lego renew）が担当する。
#   kubectl apply -f apps/lego/job.yaml
#   kubectl -n lego logs job/lego-run
apiVersion: batch/v1
kind: Job
metadata:
  name: lego-run
  namespace: lego
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: lego
          image: goacme/lego
          args:
            - --dns
            - cloudflare
            # TODO: ドメインとメールアドレスを実際のものに変更すること
            - -d
            - domain.test
            - -d
            - "*.domain.test"
            - --email
            - your-email@example.com
            - --path
            - /data
            - -a
            - run
          envFrom:
            - secretRef:
                name: lego-cloudflare
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lego-data
