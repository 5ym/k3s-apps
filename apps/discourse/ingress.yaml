apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: discourse
  namespace: discourse
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`i.daco.dev`)
      kind: Rule
      services:
        - name: discourse
          port: 3000
