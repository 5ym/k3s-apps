apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: watch
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: watch
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: renderer
  namespace: watch
spec:
  selector:
    app: renderer
  ports:
    - name: http
      port: 8081
      targetPort: 8081
