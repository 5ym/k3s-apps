# 旧 koel/.env 相当。k8s では env で渡すので .env ファイルのマウントは廃止した。
# APP_KEY は `docker run --rm phanan/koel php artisan key:generate --show` で生成する。
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: koel
  namespace: koel
type: Opaque
stringData:
  app-key: "base64:CHANGE_ME"
  db-password: "CHANGE_ME"
