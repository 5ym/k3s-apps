apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: koel
spec:
  selector:
    app: db
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: koel
  namespace: koel
spec:
  selector:
    app: koel
  ports:
    - name: http
      port: 80
      targetPort: 80
