apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rocketchat
  namespace: rocketchat
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # TODO: 旧 compose のまま r.localhost のプレースホルダ。実ホスト名に変更すること。
    # （.localhost のままだと mydnschallenge で証明書は取得できない）
    - match: Host(`r.localhost`)
      kind: Rule
      services:
        - name: rocketchat
          port: 3000
