# 旧 compose の r-init サービス相当。replSet 未初期化のときだけ rs.initiate を実行する。
# 何度実行しても安全なので、必要になったら
#   kubectl -n rocketchat delete job mongo-rs-init && kubectl apply -f apps/rocketchat/job.yaml
# で再実行できる。
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-rs-init
  namespace: rocketchat
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:8
          command:
            - mongosh
            - --host
            - mongo
            - --quiet
            - --eval
            - |
              try {
                rs.status();
                print("replica set already initialised");
              } catch (e) {
                printjson(rs.initiate({
                  _id: "rs0",
                  members: [{ _id: 0, host: "mongo:27017" }]
                }));
              }
