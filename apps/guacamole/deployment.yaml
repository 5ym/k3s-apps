apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: guacamole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # 旧 init.sh の `docker run guacamole/guacamole initdb.sh --postgres > initdb.sql`
      # 相当。emptyDir に吐いて postgres の docker-entrypoint-initdb.d に渡す。
      # 初回起動（データディレクトリが空）のときだけ postgres 側で実行される。
      initContainers:
        - name: initdb
          image: guacamole/guacamole
          command:
            - /bin/sh
            - -c
            - /opt/guacamole/bin/initdb.sh --postgres > /initdb/initdb.sql
          volumeMounts:
            - name: initdb
              mountPath: /initdb
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: POSTGRES_HOST_AUTH_METHOD
              value: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole
                  key: postgres-password
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: guacamole-postgres
        - name: initdb
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd:latest
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: guacd
              containerPort: 4822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guac
  namespace: guacamole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guac
  template:
    metadata:
      labels:
        app: guac
    spec:
      containers:
        - name: guac
          image: guacamole/guacamole
          env:
            - name: TZ
              value: Asia/Tokyo
            - name: GUACD_HOSTNAME
              value: guacd
            - name: POSTGRES_HOSTNAME
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole
                  key: postgres-password
          ports:
            - name: http
              containerPort: 8080
