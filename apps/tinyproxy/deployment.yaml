apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyproxy
  namespace: tinyproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyproxy
  template:
    metadata:
      labels:
        app: tinyproxy
    spec:
      containers:
        - name: tinyproxy
          image: kalaksi/tinyproxy
          envFrom:
            - secretRef:
                name: tinyproxy
          env:
            - name: TZ
              value: Asia/Tokyo
          ports:
            - name: proxy
              containerPort: 8888
