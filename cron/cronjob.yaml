# 旧 crontab（毎週水曜 10:00 JST に web コンテナで node cu.js を 2 回実行）を
# CronJob 2 本に分解したもの。旧構成の MAILTO/ssmtp によるメール通知は移していない
# （失敗は kubectl get cronjob / ArgoCD / Grafana 側で見る前提）。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cu-m
  namespace: cron
spec:
  schedule: "0 10 * * 3"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: cron-exec
          containers:
            - name: kubectl
              image: rancher/kubectl:v1.36.2
              args:
                # TODO: namespace と Deployment 名を実際のものに合わせること
                - exec
                - -n
                - web
                - deploy/web
                - --
                - sh
                - -c
                - cd /var/lib/nginx/html/m && node cu.js
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cu-r
  namespace: cron
spec:
  schedule: "0 10 * * 3"
  timeZone: Asia/Tokyo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: cron-exec
          containers:
            - name: kubectl
              image: rancher/kubectl:v1.36.2
              args:
                # TODO: namespace と Deployment 名を実際のものに合わせること
                - exec
                - -n
                - web
                - deploy/web
                - --
                - sh
                - -c
                - cd /var/lib/nginx/html/r && node cu.js
