# 旧構成は crond コンテナに /var/run/docker.sock を渡して `docker exec` していた。
# k8s では ServiceAccount + `kubectl exec` 権限に置き換える。
# Role / RoleBinding は「exec される側」の namespace に置く必要がある。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cron-exec
  namespace: cron
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cron-exec
  # TODO: web の Deployment が居る namespace に合わせること
  namespace: web
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cron-exec
  # TODO: 上の Role と同じ namespace に合わせること
  namespace: web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cron-exec
subjects:
  - kind: ServiceAccount
    name: cron-exec
    namespace: cron
