# Grafana の管理者アカウント。chart の grafana.admin.existingSecret から引く。
# 既定は prom-operator という決め打ちのパスワードなので必ず変えること:
#      openssl rand -base64 32
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: watch
type: Opaque
stringData:
  admin-user: admin
  admin-password: "CHANGE_ME"
---
# Grafana のメール通知（GF_SMTP_*）用。envFrom でそのまま環境変数になる。
# 実値を入れたら bootstrap/kubeseal.sh で SealedSecret 化してからコミットすること。
apiVersion: v1
kind: Secret
metadata:
  name: grafana-smtp
  namespace: watch
type: Opaque
stringData:
  GF_SMTP_HOST: ""
  GF_SMTP_FROM_ADDRESS: ""
  GF_SMTP_USER: ""
  GF_SMTP_PASSWORD: ""
