# Prometheus 本体の設定。最小構成しか入れていない。
# TODO: scrape 対象は環境に合わせて足すこと。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: watch
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      # k3s 同梱 Traefik のメトリクス（HelmChartConfig で metrics.prometheus を
      # 有効にしている場合のみ）
      # - job_name: traefik
      #   static_configs:
      #     - targets: ['traefik.kube-system.svc.cluster.local:9100']

      # kubelet / cAdvisor を取る場合は ServiceAccount と ClusterRole
      # （nodes/metrics, nodes/proxy への get）が別途必要。
      # - job_name: kubernetes-cadvisor
