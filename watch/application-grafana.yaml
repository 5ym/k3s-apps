# **Grafana は本家（grafana-community）の Helm chart から出す。**
#
# grafana/helm-charts は grafana-community/helm-charts に移管されたので、
# repoURL は移管後のものを指している。
#
# 素の頃に別 Deployment で立てていた image-renderer は chart の
# imageRenderer に寄せた（GF_RENDERING_SERVER_URL / CALLBACK_URL は
# chart が自動で入れる）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: watch-grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: watch
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: 12.10.4
    helm:
      releaseName: grafana
      valuesObject:
        # Service 名を素の頃と同じ `grafana` に固定する。
        # ingress.yaml がこの名前で引いている。
        fullnameOverride: grafana

        # chart 側の Ingress は使わない（ingress.yaml の IngressRoute で出す）
        ingress:
          enabled: false

        # chart には PVC を作らせず、pvc.yaml の local-path-retain を渡す
        persistence:
          enabled: true
          type: pvc
          existingClaim: grafana-data

        env:
          TZ: Asia/Tokyo
          GF_EXTERNAL_IMAGE_STORAGE_PROVIDER: local

        # SMTP の資格情報は secret.yaml（GF_SMTP_*）から envFrom で入れる
        envFromSecret: grafana-smtp

        grafana.ini:
          server:
            # ingress.yaml の Grafana 側のホスト名。
            # 素の頃は Prometheus 側のホスト名が入っていたので直した。
            root_url: https://ga.doany.io
          smtp:
            enabled: true

        # 同じ namespace の Prometheus を既定のデータソースにする
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                url: http://prometheus
                access: proxy
                isDefault: true

        imageRenderer:
          enabled: true
          env:
            BROWSER_TZ: Asia/Tokyo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 素のマニフェストで入っていた同名のリソースを chart 側が引き取る
      - ServerSideApply=true
