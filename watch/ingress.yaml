apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: watch
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`ps.doany.io`)
      kind: Rule
      # Prometheus 自身には認証がないので bootstrap の forward-auth を挟む。
      # 不要なら middlewares ごと消す。
      middlewares:
        - name: forward-auth
          namespace: auth
      services:
        # chart が作る Service。fullnameOverride: watch なので watch-prometheus。
        # port は chart 既定の 9090。
        - name: watch-prometheus
          port: 9090
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: watch
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # Grafana 自身に認証があるので forward-auth は挟んでいない。
    # 変更したら application.yaml の grafana.ini の root_url も合わせること。
    - match: Host(`gn.doany.io`)
      kind: Rule
      services:
        # grafana サブチャートが作る Service。
        # grafana.fullnameOverride: grafana で名前を固定し、port は既定の 80。
        - name: grafana
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager
  namespace: watch
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`ar.doany.io`)
      kind: Rule
      # Alertmanager 自身にも認証がないので forward-auth を挟む。
      middlewares:
        - name: forward-auth
          namespace: auth
      services:
        # chart が作る Service。fullnameOverride: watch なので
        # watch-alertmanager。port は chart 既定の 9093。
        - name: watch-alertmanager
          port: 9093
