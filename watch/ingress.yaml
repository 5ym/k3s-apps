apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus
  namespace: watch
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    - match: Host(`ps.doany.io`)
      kind: Rule
      # Prometheus 自身には認証がないので bootstrap の forward-auth を挟む。
      # 不要なら middlewares ごと消す。
      middlewares:
        - name: forward-auth
          namespace: auth
      services:
        # chart が作る Service。server.fullnameOverride: prometheus で名前を
        # 固定し、port は chart 既定の 80（コンテナ側は 9090）。
        - name: prometheus
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: watch
spec:
  entryPoints:
    - websecure
  tls:
    certResolver: mydnschallenge
  routes:
    # Grafana 自身に認証があるので forward-auth は挟んでいない。
    # 変更したら application-grafana.yaml の grafana.ini の root_url も
    # 合わせること。
    - match: Host(`ga.doany.io`)
      kind: Rule
      services:
        # chart が作る Service。fullnameOverride: grafana で名前を固定し、
        # port は chart 既定の 80（コンテナ側は 3000）。
        - name: grafana
          port: 80
