# **Prometheus は本家（prometheus-community）の Helm chart から出す。**
#
# ApplicationSet は `watch/` を「素のマニフェストの置き場」として読むので、
# ここに Application を置いて chart を指させる（App-of-Apps）。
# この namespace には Prometheus と Grafana の2つが載るので、Application も
# application-prometheus.yaml / application-grafana.yaml の2つに分けている。
#
# 素の頃は configmap.yaml に scrape 設定を手で書いていて localhost しか
# 取れていなかった。chart の既定 scrapeConfigs が apiserver / node /
# cAdvisor / service endpoints / pod のサービスディスカバリを一通り持って
# いるので、そちらに寄せる。ノードとクラスタのメトリクスは同梱の
# node-exporter と kube-state-metrics が出す。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: watch-prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: watch
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.24.0
    helm:
      releaseName: prometheus
      valuesObject:
        server:
          # Service 名を素の頃と同じ `prometheus` に固定する。
          # ingress.yaml がこの名前で引いている。
          fullnameOverride: prometheus
          retention: 15d
          # chart 側の Ingress は使わない（ingress.yaml の IngressRoute で出す）
          ingress:
            enabled: false
          # chart には PVC を作らせず、pvc.yaml の local-path-retain を渡す
          persistentVolume:
            enabled: true
            existingClaim: prometheus-data

        # 素の構成に無かったものは足さない
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false

        # ノードとクラスタのメトリクス（既定の scrapeConfigs が拾う）
        prometheus-node-exporter:
          enabled: true
        kube-state-metrics:
          enabled: true

        # k3s 同梱 Traefik。HelmChartConfig で metrics.prometheus を有効に
        # していない場合はここごと消すこと（有効でないと down のままになる）。
        extraScrapeConfigs: |
          - job_name: traefik
            static_configs:
              - targets:
                  - traefik.kube-system.svc.cluster.local:9100
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # 素のマニフェストで入っていた同名のリソースを chart 側が引き取る
      - ServerSideApply=true
