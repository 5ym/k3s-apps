# 永続化するのは telemetry の SQLite が置かれる /database だけ。
# /var/www/html はイメージ内のアプリ本体なので、ボリュームで覆わないこと。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speed-database
  namespace: speed
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path-retain
  resources:
    requests:
      storage: 1Gi
